<!DOCTYPE html>
<html lang="ms" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كويز عقيدة تاهون ٦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --kertas:#F5EDDC;      /* aged paper */
  --kertas2:#FBF6EB;
  --tinta:#16283F;       /* manuscript ink navy */
  --tinta-lembut:#3E5570;
  --emas:#B08428;        /* songket gold */
  --emas-terang:#E3C775;
  --merah:#8C2F39;       /* songket red */
  --hijau:#2E6B4F;       /* correct */
  --garis:rgba(22,40,63,.14);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--kertas);
  background-image:
    radial-gradient(circle at 12% 8%, rgba(176,132,40,.07), transparent 42%),
    radial-gradient(circle at 88% 92%, rgba(140,47,57,.06), transparent 46%);
  color:var(--tinta);
  font-family:'Noto Naskh Arabic', serif;
  font-size:19px; line-height:2.1;
  padding-bottom:80px;
}
.wrap{max-width:940px;margin:0 auto;padding:0 18px}

/* ---------- Kepala ---------- */
header{
  text-align:center;padding:46px 18px 30px;
  border-bottom:3px double var(--emas);
  background:linear-gradient(180deg,rgba(251,246,235,.9),transparent);
}
.bunga{color:var(--emas);font-size:26px;letter-spacing:.5em;margin-bottom:14px;line-height:1}
h1{
  font-family:'Amiri',serif;font-weight:700;
  font-size:clamp(34px,7vw,54px);margin:0 0 10px;line-height:1.5;
}
.sub{font-size:clamp(17px,3.4vw,21px);color:var(--tinta-lembut);margin:0}
.sub-latin{font-family:'Inter',sans-serif;font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--emas);margin-top:12px;direction:ltr}

/* ---------- Tab tajuk ---------- */
nav{
  position:sticky;top:0;z-index:20;background:rgba(245,237,220,.97);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--garis);
  padding:12px 0;margin-bottom:34px;
}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 14px}
.tab{
  font-family:'Noto Naskh Arabic',serif;font-size:clamp(18px,3.6vw,23px);font-weight:600;
  background:transparent;color:var(--tinta-lembut);
  border:2px solid var(--garis);border-radius:2px 14px 2px 14px;
  padding:9px 20px;cursor:pointer;transition:.18s;line-height:1.7;
}
.tab:hover{border-color:var(--emas);color:var(--tinta)}
.tab[aria-selected="true"]{background:var(--tinta);color:var(--kertas2);border-color:var(--tinta)}
.tab:focus-visible{outline:3px solid var(--merah);outline-offset:2px}

/* ---------- Panel topik ---------- */
.topik{display:none}
.topik.aktif{display:block;animation:masuk .3s ease}
@keyframes masuk{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.topik-kepala{text-align:center;margin-bottom:8px}
.topik-kepala h2{font-family:'Amiri',serif;font-size:clamp(30px,6vw,44px);margin:0 0 6px;line-height:1.5}
.topik-kepala .ltn{font-family:'Inter',sans-serif;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--emas);direction:ltr}

/* ---------- Kotak dalil ---------- */
.dalil{
  background:var(--kertas2);border:1px solid var(--garis);
  border-right:5px solid var(--emas);border-radius:3px;
  padding:20px 22px;margin:26px 0 34px;
}
.dalil h3{font-family:'Amiri',serif;font-size:24px;margin:0 0 14px;color:var(--merah)}
.dalil-item{padding:12px 0;border-top:1px dotted var(--garis)}
.dalil-item:first-of-type{border-top:none}
.ayat{font-family:'Amiri',serif;font-size:clamp(22px,4.6vw,29px);line-height:2.2;margin:0 0 6px}
.rujuk{font-size:16px;color:var(--emas);font-weight:600;margin:0 0 4px}
.makna{font-size:17px;color:var(--tinta-lembut);margin:0}

/* ---------- Bahagian soalan ---------- */
.bhg{
  background:var(--kertas2);border:1px solid var(--garis);border-radius:4px;
  padding:26px 22px;margin-bottom:30px;
}
.bhg-kepala{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding-bottom:14px;margin-bottom:20px;border-bottom:2px solid var(--emas)}
.bhg-huruf{
  font-family:'Amiri',serif;font-size:30px;font-weight:700;color:var(--kertas2);
  background:var(--merah);width:46px;height:46px;flex:0 0 46px;
  display:grid;place-items:center;border-radius:50%;line-height:1;
}
.bhg-kepala h3{font-size:clamp(21px,4.2vw,27px);margin:0;font-weight:700}
.bhg-kepala .arahan{font-size:16px;color:var(--tinta-lembut);width:100%;margin:0}

.soalan{padding:18px 0;border-top:1px solid var(--garis)}
.soalan:first-of-type{border-top:none;padding-top:0}
.s-teks{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.s-no{
  font-family:'Amiri',serif;font-weight:700;font-size:22px;color:var(--emas);
  flex:0 0 40px;text-align:center;line-height:1.9;
}
.s-body{flex:1;font-size:clamp(19px,3.8vw,23px);line-height:2}

/* pilihan */
.pilihan{display:grid;gap:9px;padding-right:52px}
@media(max-width:560px){.pilihan{padding-right:0}}
.pil{
  display:flex;gap:11px;align-items:flex-start;
  border:2px solid var(--garis);border-radius:3px;background:var(--kertas);
  padding:10px 14px;cursor:pointer;transition:.15s;font-size:clamp(18px,3.6vw,21px);line-height:1.95;
}
.pil:hover{border-color:var(--emas-terang)}
.pil input{margin:0;width:22px;height:22px;flex:0 0 22px;margin-top:9px;accent-color:var(--tinta);cursor:pointer}
.pil:has(input:checked){border-color:var(--tinta);background:#fff}
.pil:has(input:focus-visible){outline:3px solid var(--merah);outline-offset:2px}

/* betul/salah */
.bs{display:flex;gap:12px;padding-right:52px;flex-wrap:wrap}
@media(max-width:560px){.bs{padding-right:0}}
.bs .pil{flex:1 1 150px;justify-content:center;font-weight:600}

/* seret & lepas */
.bank{
  display:flex;flex-wrap:wrap;gap:10px;padding:16px;margin-bottom:22px;
  background:var(--kertas);border:2px dashed var(--emas-terang);border-radius:4px;min-height:74px;
}
.bank-label{width:100%;font-size:15px;color:var(--tinta-lembut);margin:0 0 4px}
.chip{
  font-family:'Noto Naskh Arabic',serif;font-size:clamp(18px,3.6vw,22px);font-weight:600;
  background:var(--tinta);color:var(--kertas2);border:none;
  padding:7px 18px;border-radius:2px 12px 2px 12px;cursor:grab;line-height:1.9;
  transition:.15s;user-select:none;
}
.chip:hover{background:var(--tinta-lembut)}
.chip.dipilih{background:var(--merah);box-shadow:0 0 0 3px var(--emas-terang)}
.chip:focus-visible{outline:3px solid var(--merah);outline-offset:2px}
.chip[disabled]{opacity:.25;cursor:default}
.lubang{
  display:inline-block;min-width:130px;min-height:44px;vertical-align:middle;
  border-bottom:3px solid var(--emas);background:rgba(176,132,40,.08);
  border-radius:3px;padding:2px 12px;margin:0 6px;cursor:pointer;transition:.15s;
  font-weight:600;text-align:center;line-height:2.2;
}
.lubang.sasar{background:var(--emas-terang);border-bottom-color:var(--merah)}
.lubang:focus-visible{outline:3px solid var(--merah);outline-offset:2px}

/* jawapan sebenar (bukan pilihan murid) */
.jawapan{
  border-color:var(--emas)!important;background:rgba(176,132,40,.14)!important;
  border-style:dashed!important;position:relative;
}
.kata.jawapan{border-color:var(--emas)!important;background:rgba(176,132,40,.2)!important;border-style:dashed!important}
.jawapan::after{
  content:'← جواڤن';font-size:14px;color:var(--emas);font-weight:700;
  margin-inline-start:auto;padding-inline-start:10px;white-space:nowrap;
}
.kata.jawapan::after{content:''}
/* keputusan */
.betul{border-color:var(--hijau)!important;background:rgba(46,107,79,.09)!important}
.salah{border-color:var(--merah)!important;background:rgba(140,47,57,.08)!important}
.lubang.betul{background:rgba(46,107,79,.15)!important;border-bottom-color:var(--hijau)!important}
.lubang.salah{background:rgba(140,47,57,.12)!important;border-bottom-color:var(--merah)!important}
.maklum{font-size:17px;margin:10px 0 0;padding-right:52px;font-weight:600}
@media(max-width:560px){.maklum{padding-right:0}}
.maklum.ok{color:var(--hijau)}
.maklum.no{color:var(--merah)}

.tindakan{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  margin-top:24px;padding-top:20px;border-top:2px solid var(--emas)}
.btn{
  font-family:'Noto Naskh Arabic',serif;font-size:clamp(19px,3.8vw,23px);font-weight:700;
  background:var(--tinta);color:var(--kertas2);border:2px solid var(--tinta);
  padding:11px 32px;border-radius:2px 14px 2px 14px;cursor:pointer;transition:.18s;line-height:1.8;
}
.btn:hover{background:var(--merah);border-color:var(--merah)}
.btn:focus-visible{outline:3px solid var(--merah);outline-offset:3px}
.btn.kedua{background:transparent;color:var(--tinta)}
.btn.kedua:hover{background:var(--tinta);color:var(--kertas2)}
.skor{
  font-family:'Amiri',serif;font-size:clamp(22px,4.4vw,28px);font-weight:700;
  padding:6px 20px;border-radius:3px;background:var(--kertas);border:2px solid var(--emas);
}
.skor.penuh{background:var(--hijau);color:#fff;border-color:var(--hijau)}
footer{text-align:center;padding:36px 18px;color:var(--tinta-lembut);font-size:15px}
footer .bunga{font-size:20px;margin-bottom:10px}

/* padankan */
.padan-baris{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  padding:12px 0;border-top:1px solid var(--garis)}
.padan-baris:first-of-type{border-top:none}
.padan-t{flex:0 0 190px;font-weight:700;font-size:clamp(19px,3.8vw,23px)}
select{
  font-family:'Noto Naskh Arabic',serif;font-size:clamp(17px,3.4vw,20px);
  padding:9px 12px;border:2px solid var(--garis);border-radius:3px;
  background:var(--kertas);color:var(--tinta);flex:1;min-width:200px;line-height:1.9;cursor:pointer;
}
select:focus-visible{outline:3px solid var(--merah);outline-offset:2px}
select.betul{border-color:var(--hijau);background:rgba(46,107,79,.09)}
select.salah{border-color:var(--merah);background:rgba(140,47,57,.08)}
.padan-jwp{width:100%;font-size:16px;font-weight:600;margin:4px 0 0}
/* susun */
.susun-set{margin-bottom:24px}
.susun-tajuk{font-weight:700;font-size:clamp(19px,3.8vw,23px);margin:0 0 12px}
.susun-baris{display:flex;gap:12px;align-items:center;padding:9px 0;
  border-top:1px solid var(--garis);flex-wrap:wrap}
.susun-baris:first-of-type{border-top:none}
.susun-baris select{flex:0 0 92px;min-width:92px;text-align:center}
.susun-teks{flex:1;font-size:clamp(18px,3.6vw,22px);min-width:180px}
/* jawapan bertulis */
textarea{
  font-family:'Noto Naskh Arabic',serif;font-size:clamp(18px,3.6vw,21px);line-height:2;
  width:100%;min-height:88px;padding:12px 14px;border:2px solid var(--garis);
  border-radius:3px;background:var(--kertas);color:var(--tinta);resize:vertical;
}
textarea:focus-visible{outline:3px solid var(--merah);outline-offset:2px}
.model{
  background:rgba(176,132,40,.12);border-right:4px solid var(--emas);
  padding:12px 16px;margin:12px 0 0;border-radius:3px;font-size:clamp(17px,3.4vw,20px)
}
.model b{color:var(--merah)}
.tanda{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:center}
.tanda .lbl{font-size:16px;color:var(--tinta-lembut)}
.tbtn{
  font-family:'Noto Naskh Arabic',serif;font-size:18px;font-weight:700;cursor:pointer;
  padding:7px 20px;border-radius:2px 12px 2px 12px;border:2px solid var(--garis);
  background:var(--kertas);color:var(--tinta);line-height:1.8;transition:.15s;
}
.tbtn:hover{border-color:var(--emas)}
.tbtn.pilih-ok{background:var(--hijau);color:#fff;border-color:var(--hijau)}
.tbtn.pilih-no{background:var(--merah);color:#fff;border-color:var(--merah)}
.tbtn:focus-visible{outline:3px solid var(--merah);outline-offset:2px}

.dua-pilih{display:flex;gap:14px;flex-wrap:wrap;padding-right:52px}
@media(max-width:560px){.dua-pilih{padding-right:0}}
.mini{display:flex;align-items:center;gap:8px;flex:1 1 300px;font-size:16px;color:var(--tinta-lembut)}
.mini select{flex:1}
.ganti{padding-right:52px;margin-top:10px;max-width:520px}
@media(max-width:560px){.ganti{padding-right:0}}
.pil-bin{font-weight:600}
.ayat-salah{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kata{
  font-family:'Noto Naskh Arabic',serif;font-size:clamp(18px,3.6vw,22px);line-height:1.9;
  background:transparent;border:2px dashed transparent;border-radius:3px;
  padding:2px 8px;cursor:pointer;color:var(--tinta);transition:.13s;
}
.kata:hover{border-color:var(--emas-terang);background:rgba(176,132,40,.1)}
.kata.tanda-salah{background:var(--merah);color:var(--kertas2);border-color:var(--merah)}
.kata.betul{background:rgba(46,107,79,.2);border-color:var(--hijau);border-style:solid}
.kata.salah{background:rgba(140,47,57,.16);border-color:var(--merah);border-style:solid}
.kata:focus-visible{outline:3px solid var(--merah);outline-offset:2px}
/* kaunter */
.kaunter{max-width:940px;margin:0 auto;padding:10px 18px 2px}
.kaunter-atas{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.k-besar{font-family:'Amiri',serif;font-size:clamp(21px,4vw,26px);font-weight:700}
.k-label{font-size:14px;color:var(--tinta-lembut)}
.k-betul{margin-inline-start:auto;font-size:15px;font-weight:600;color:var(--hijau)}
.k-fasal{display:flex;gap:14px;flex-wrap:wrap}
.k-blok{display:flex;align-items:center;gap:6px}
.k-nama{font-size:13px;color:var(--tinta-lembut);flex:0 0 auto}
.k-seg{display:flex;gap:3px}
.k-seg i{
  width:11px;height:15px;border-radius:2px;display:block;cursor:pointer;
  border:1px solid var(--garis);background:transparent;transition:.15s;
}
.k-seg i:hover{transform:scaleY(1.25)}
.k-seg i.isi{background:var(--emas-terang);border-color:var(--emas)}
.k-seg i.ok{background:var(--hijau);border-color:var(--hijau)}
.k-seg i.sebahagian{background:var(--merah);border-color:var(--merah);opacity:.75}
@media(max-width:560px){.k-seg i{width:9px;height:13px}.k-nama{display:none}}

/* ---- bar halaman ---- */
.halaman-bar{position:sticky;top:0;z-index:30;background:var(--tinta);padding:0}
.halaman-tabs{max-width:940px;margin:0 auto;display:flex}
.hal-tab{
  flex:1;font-family:'Amiri',serif;font-size:clamp(21px,4.4vw,27px);font-weight:700;
  background:transparent;color:rgba(245,237,220,.55);border:none;border-bottom:4px solid transparent;
  padding:15px 8px 12px;cursor:pointer;transition:.18s;line-height:1.6;
}
.hal-tab:hover{color:var(--kertas2)}
.hal-tab[aria-selected="true"]{color:var(--kertas2);border-bottom-color:var(--emas)}
.hal-tab:focus-visible{outline:3px solid var(--emas-terang);outline-offset:-4px}
nav{top:62px}
/* ---- nota ---- */
.n-blok{background:var(--kertas2);border:1px solid var(--garis);border-radius:4px;
  padding:24px 22px;margin-bottom:26px}
.n-kepala{display:flex;align-items:center;gap:12px;padding-bottom:12px;margin-bottom:16px;
  border-bottom:2px solid var(--emas)}
.n-ikon{font-size:24px;line-height:1}
.n-kepala h3{margin:0;font-size:clamp(21px,4.2vw,27px);font-weight:700}
.n-ringkas p{font-size:clamp(19px,3.8vw,23px);line-height:2.15;margin:0 0 14px}
mark{background:linear-gradient(transparent 55%, var(--emas-terang) 55%);color:inherit;
  padding:0 2px;font-weight:700}
.n-kunci{list-style:none;padding:0;margin:0}
.n-kunci li{
  position:relative;padding:11px 40px 11px 14px;margin-bottom:8px;
  background:var(--kertas);border-right:4px solid var(--emas);border-radius:3px;
  font-size:clamp(18px,3.6vw,22px);line-height:1.95;
}
.n-kunci li::before{content:'◆';position:absolute;right:14px;top:11px;color:var(--emas);font-size:14px}
.n-jadual{margin-bottom:22px}
.n-jadual h4{font-size:clamp(19px,3.8vw,22px);margin:0 0 10px;color:var(--merah)}
.jd-bungkus{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:440px;background:var(--kertas)}
th,td{border:1px solid var(--garis);padding:11px 13px;text-align:right;
  font-size:clamp(16px,3.2vw,19px);line-height:1.9;vertical-align:top}
th{background:var(--tinta);color:var(--kertas2);font-weight:700}
tbody tr:nth-child(odd){background:var(--kertas2)}
tbody td:first-child{font-weight:700}
.n-tip{background:rgba(176,132,40,.13);border-right:4px solid var(--emas);
  border-radius:3px;padding:13px 16px;margin-bottom:11px}
.n-tip b{display:block;color:var(--merah);font-size:clamp(17px,3.4vw,20px);margin-bottom:4px}
.n-tip span{font-size:clamp(17px,3.4vw,20px);line-height:1.95}
/* ---- peta minda ---- */
.peta{padding:6px 0}
.peta-pusat{
  display:inline-block;background:var(--tinta);color:var(--kertas2);
  font-family:'Amiri',serif;font-size:clamp(22px,4.4vw,28px);font-weight:700;
  padding:11px 30px;border-radius:3px 18px 3px 18px;margin-bottom:6px;line-height:1.7;
}
.peta-cabang{position:relative;padding:16px 26px 4px 0;margin-right:26px;
  border-right:3px solid var(--emas)}
.peta-cabang::before{content:'';position:absolute;right:-3px;top:30px;width:20px;height:3px;
  background:var(--emas)}
.peta-c-tajuk{
  display:inline-block;background:var(--merah);color:var(--kertas2);font-weight:700;
  font-size:clamp(18px,3.6vw,22px);padding:7px 20px;border-radius:2px 14px 2px 14px;
  margin-bottom:9px;line-height:1.8;
}
.peta-anak{display:flex;flex-wrap:wrap;gap:8px;padding-right:14px}
.peta-anak span{
  background:var(--kertas);border:2px solid var(--emas-terang);border-radius:2px 12px 2px 12px;
  padding:6px 15px;font-size:clamp(16px,3.2vw,20px);line-height:1.85;
}
/* ---- glosari ---- */
.g-alat{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
#cari{
  flex:1 1 260px;font-family:'Noto Naskh Arabic',serif;font-size:clamp(18px,3.6vw,21px);
  padding:12px 16px;border:2px solid var(--garis);border-radius:3px;
  background:var(--kertas2);color:var(--tinta);line-height:1.9;
}
#cari:focus-visible{outline:3px solid var(--merah);outline-offset:2px}
.g-tapis{display:flex;gap:7px;flex-wrap:wrap}
.g-btn{
  font-family:'Noto Naskh Arabic',serif;font-size:17px;font-weight:600;cursor:pointer;
  padding:8px 17px;border:2px solid var(--garis);border-radius:2px 12px 2px 12px;
  background:var(--kertas2);color:var(--tinta-lembut);line-height:1.8;transition:.15s;
}
.g-btn:hover{border-color:var(--emas)}
.g-btn[aria-pressed="true"]{background:var(--tinta);color:var(--kertas2);border-color:var(--tinta)}
.g-btn:focus-visible{outline:3px solid var(--merah);outline-offset:2px}
.g-senarai{display:grid;gap:10px}
.g-item{
  background:var(--kertas2);border:1px solid var(--garis);border-right:4px solid var(--emas);
  border-radius:3px;padding:15px 18px;
}
.g-atas{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.g-istilah{font-family:'Amiri',serif;font-weight:700;font-size:clamp(21px,4.2vw,26px);line-height:1.7}
.g-fasal{font-size:13px;color:var(--kertas2);background:var(--emas);

const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const kocok = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);

const tabs = document.getElementById('tabs');
const isi  = document.getElementById('isi');

BANK.forEach((t, ti) => {
  const b = document.createElement('button');
  b.className = 'tab'; b.textContent = t.tab;
  b.setAttribute('role','tab');
  b.setAttribute('aria-selected', ti === 0 ? 'true' : 'false');
  b.onclick = () => pilihTopik(ti);
  tabs.appendChild(b);

  const panel = document.createElement('section');
  panel.className = 'topik' + (ti === 0 ? ' aktif' : '');
  panel.id = 'topik-' + t.id;
  panel.innerHTML = `
    <div class="topik-kepala">
      <h2>${esc(t.title)}</h2>
      <div class="ltn">${esc(t.latin)}</div>
    </div>
    ${bhgMCQ(t)}
    ${bhgTF(t)}
    ${bhgDD(t)}
    ${bhgPadan(t)}
    ${bhgSusun(t)}
    ${bhgKenal(t)}
    ${bhgSebab(t)}
    ${bhgKelas(t)}
    ${bhgTindak(t)}
    ${bhgSalah(t)}

  isi.appendChild(panel);
});

const skorSet = {};   // data-set -> markah selepas disemak

function bilJawab(bhg){
  const j = bhg.dataset.jenis;
  if (j === 'padan')  return [...bhg.querySelectorAll('[data-padan]')].filter(s=>s.value!=='').length;
  if (j === 'susun')  return [...bhg.querySelectorAll('[data-susun]')].filter(s=>s.value!=='').length;
  if (j === 'dd')     return [...bhg.querySelectorAll('.lubang')].filter(l=>l.dataset.kata).length;
  if (j === 'sebab')  return [...bhg.querySelectorAll('.soalan')].filter(sq =>
      sq.querySelector('[data-jns="k"]').value!=='' && sq.querySelector('[data-jns="s"]').value!=='').length;
  if (j === 'salah')  return [...bhg.querySelectorAll('.soalan')].filter(sq =>
      sq.querySelector('.kata.tanda-salah') && sq.querySelector('[data-ganti]').value!=='').length;
  return [...bhg.querySelectorAll('.soalan')].filter(sq=>sq.querySelector('input:checked')).length;
}

function binaKaunter(){
  const wrap = document.getElementById('kFasal');
  wrap.innerHTML = BANK.map(t=>`
    <div class="k-blok">

      <span class="k-seg" data-topik="${t.id}">
        ${[...Array(10)].map((_,i)=>`<i data-idx="${i}" title="${esc(t.tab)} · بهاݢين ${AR(i+1)}"></i>`).join('')}
      </span>
    </div>`).join('');
  wrap.addEventListener('click', e=>{
    const seg = e.target.closest('i'); if(!seg) return;
    const id = seg.closest('.k-seg').dataset.topik;
    pilihTopik(BANK.findIndex(x=>x.id===id));
    setTimeout(()=>{
      const b = document.querySelectorAll(`#topik-${id} .bhg`)[+seg.dataset.idx];
      if (b) b.scrollIntoView({block:'start', behavior:'smooth'});
    }, 120);
  });
}

function kemasKini(){
  let jawab = 0, betulJum = 0, adaSkor = false;
  BANK.forEach(t=>{
    const seksyen = document.querySelectorAll(`#topik-${t.id} .bhg`);
    const segs = document.querySelectorAll(`.k-seg[data-topik="${t.id}"] i`);
    seksyen.forEach((bhg,i)=>{
      const n = bilJawab(bhg); jawab += n;
      const s = segs[i]; if(!s) return;
      s.classList.remove('isi','ok','sebahagian');
      const markah = skorSet[bhg.dataset.set];
      if (markah !== undefined){
        adaSkor = true; betulJum += markah;
        s.classList.add(markah === 10 ? 'ok' : 'sebahagian');
        s.title = `${t.tab} · بهاݢين ${AR(i+1)} — سكور ${AR(markah)}/١٠`;
      } else if (n === 10){
        s.classList.add('isi');
        s.title = `${t.tab} · بهاݢين ${AR(i+1)} — لڠكڤ، بلوم دسمق`;
      } else if (n > 0){
        s.classList.add('isi'); s.style.opacity = .45;
        s.title = `${t.tab} · بهاݢين ${AR(i+1)} — ${AR(n)}/١٠`;
      } else { s.style.opacity = ''; s.title = `${t.tab} · بهاݢين ${AR(i+1)}`; }
      if (n === 10 || markah !== undefined) s.style.opacity = '';
    });
  });
  document.getElementById('kBesar').textContent = AR(jawab) + ' / ٤٠٠';
  const kb = document.getElementById('kBetul');
  kb.hidden = !adaSkor;
  if (adaSkor) kb.textContent = '✓ بتول: ' + AR(betulJum);
}

document.addEventListener('change', kemasKini);

});

/* ====== SERET & LEPAS ====== */
let dipilih = null;
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip && !chip.disabled){
    if (dipilih === chip){ chip.classList.remove('dipilih'); dipilih = null; }
    else { if(dipilih) dipilih.classList.remove('dipilih'); dipilih = chip; chip.classList.add('dipilih'); }
    return;
  }
  const lub = e.target.closest('.lubang');
  if (lub){
    if (lub.dataset.kata){ pulangKata(lub); return; }
    if (dipilih){ letakKata(lub, dipilih); dipilih.classList.remove('dipilih'); dipilih = null; }
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('lubang')){
    e.preventDefault(); e.target.click();
  }
});
document.addEventListener('dragstart', e => {
  const chip = e.target.closest('.chip');
  if (chip && !chip.disabled){ dipilih = chip; e.dataTransfer.setData('text/plain', chip.dataset.kata); }
});
document.addEventListener('dragover', e => {
  const lub = e.target.closest('.lubang');
  if (lub){ e.preventDefault(); lub.classList.add('sasar'); }
});
document.addEventListener('dragleave', e => {
  const lub = e.target.closest('.lubang'); if (lub) lub.classList.remove('sasar');
});
document.addEventListener('drop', e => {
  const lub = e.target.closest('.lubang');
  if (lub && dipilih){ e.preventDefault(); lub.classList.remove('sasar');
    letakKata(lub, dipilih); dipilih.classList.remove('dipilih'); dipilih = null; }
});

function letakKata(lub, chip){
  const bhg = lub.closest('.bhg');
  if (lub.dataset.kata) pulangKata(lub);           // kosongkan dulu
  lub.dataset.kata = chip.dataset.kata;
  lub.textContent = chip.dataset.kata;
  lub.dataset.chipId = chip.dataset.id || (chip.dataset.id = 'c' + Math.random().toString(36).slice(2));
  chip.disabled = true;
}
function pulangKata(lub){
  const bhg = lub.closest('.bhg');
  const chip = bhg.querySelector(`.chip[data-id="${lub.dataset.chipId}"]`);
  if (chip) chip.disabled = false;
  delete lub.dataset.kata; delete lub.dataset.chipId;
  lub.textContent = ''; lub.classList.remove('betul','salah');
}

function semak(bhg){
  const t = BANK.find(x => x.id === bhg.dataset.topik);
  const jenis = bhg.dataset.jenis;
  let betul = 0;

  /* --- jenis baharu --- */
  if (jenis === 'sebab'){
    const d = BANK3[t.id].sebab;
    bhg.querySelectorAll('.soalan').forEach(sq => {
      const i = +sq.dataset.i, m = d.q[i];
      const sk = sq.querySelector('[data-jns="k"]'), ss = sq.querySelector('[data-jns="s"]');
      const okK = sk.value !== '' && +sk.value === m.ka;
      const okS = ss.value !== '' && +ss.value === m.sa;
      [[sk,okK],[ss,okS]].forEach(([el,ok])=>{
        el.classList.remove('betul','salah'); el.classList.add(ok?'betul':'salah');
      });
      const ok = okK && okS, mk = sq.querySelector('.maklum');
      mk.hidden = false; mk.className = 'maklum ' + (ok?'ok':'no');
      mk.textContent = ok ? '✓ بتول'
        : '✗ ساله — كسن: ' + d.kesan[m.ka] + ' | سبب: ' + d.sebab[m.sa];
      if (ok) betul++;
    });
    return siapSkor(bhg, betul);
  }
  if (jenis === 'kelas'){
    const d = BANK3[t.id].kelas;
    bhg.querySelectorAll('.soalan').forEach(sq => {
      const i = +sq.dataset.i, m = d.items[i];
      const pilih = sq.querySelector('input:checked');
      const ok = pilih && +pilih.value === m.b;
      sq.querySelectorAll('.pil').forEach((p,j)=>{
        p.classList.remove('betul','salah');
        if (j === m.b) p.classList.add('betul');
        else if (pilih && +pilih.value === j) p.classList.add('salah');
      });
      const mk = sq.querySelector('.maklum');
      mk.hidden = false; mk.className = 'maklum ' + (ok?'ok':'no');
      mk.textContent = ok ? '✓ بتول' : '✗ ساله — جواڤن: ' + d.bins[m.b];
      if (ok) betul++;
    });
    return siapSkor(bhg, betul);
  }
  if (jenis === 'tindak'){
    const d = BANK3[t.id].tindak;
    bhg.querySelectorAll('.soalan').forEach(sq => {
      const i = +sq.dataset.i, m = d[i];
      const pilih = sq.querySelector('input:checked');
      const ok = pilih && +pilih.value === m.a;
      sq.querySelectorAll('.pil').forEach((p,j)=>{
        p.classList.remove('betul','salah','jawapan');
        const dipilihIni = pilih && +pilih.value === j;
        if (j === m.a) p.classList.add(dipilihIni ? 'betul' : 'jawapan');
        else if (dipilihIni) p.classList.add('salah');
      });
      const mk = sq.querySelector('.maklum');
      mk.hidden = false; mk.className = 'maklum ' + (ok?'ok':'no');
      mk.textContent = (ok ? '✓ بتول — ' : '✗ ساله — جواڤن: ' + m.o[m.a] + ' — ') + m.prinsip;
      if (ok) betul++;
    });
    return siapSkor(bhg, betul);
  }
  if (jenis === 'salah'){
    const d = BANK3[t.id].salah;
    bhg.querySelectorAll('.soalan').forEach(sq => {
      const i = +sq.dataset.i, m = d[i];
      const ditanda = sq.querySelector('.kata.tanda-salah');
      const sel = sq.querySelector('[data-ganti]');
      const okKata = ditanda && +ditanda.dataset.k === m.salah;
      const okGanti = sel.value !== '' && +sel.value === m.a;
      sq.querySelectorAll('.kata').forEach(k=>{
        k.classList.remove('betul','salah','jawapan');
        const ini = +k.dataset.k === m.salah;
        if (ini && okKata)       k.classList.add('betul');   // dipilih & betul
        else if (ini)            k.classList.add('jawapan'); // jawapan sebenar
        else if (ditanda === k)  k.classList.add('salah');   // pilihan yang salah
      });
      sel.classList.remove('betul','salah'); sel.classList.add(okGanti?'betul':'salah');
      const ok = okKata && okGanti, mk = sq.querySelector('.maklum');
      mk.hidden = false; mk.className = 'maklum ' + (ok?'ok':'no');
      mk.textContent = ok ? '✓ بتول'
        : '✗ ساله — ڤركاتاءن ساله: «' + m.kata[m.salah] + '» ݢنتيڽ: ' + m.ganti[m.a];
      if (ok) betul++;
    });
    return siapSkor(bhg, betul);
  }
  if (jenis === 'padan'){
    const d = BANK2[t.id].padan;
    bhg.querySelectorAll('[data-padan]').forEach(sel => {
      const i = +sel.dataset.padan, ok = sel.value === d[i].m;
      sel.classList.remove('betul','salah'); sel.classList.add(ok?'betul':'salah');
      const mk = sel.closest('.padan-baris').querySelector('.maklum');
      mk.hidden = false; mk.className = 'padan-jwp maklum ' + (ok?'ok':'no');
      mk.textContent = ok ? '✓ بتول' : '✗ ساله — جواڤن: ' + d[i].m;
      if (ok) betul++;
    });
    return siapSkor(bhg, betul);
  }
  if (jenis === 'susun'){
    const sets = BANK2[t.id].susun;
    bhg.querySelectorAll('[data-susun]').forEach(sel => {
      const s = sets[+sel.dataset.susun];
      const kedudukan = s.betul.indexOf(sel.dataset.teks) + 1;
      const ok = +sel.value === kedudukan;
      sel.classList.remove('betul','salah'); sel.classList.add(ok?'betul':'salah');
      if (!ok) sel.title = 'جواڤن: ' + kedudukan;
      if (ok) betul++;
    });
    return siapSkor(bhg, betul);
  }
  if (jenis === 'kenal'){
    const d = BANK2[t.id].kenal;
    bhg.querySelectorAll('.soalan').forEach(sq => {
      const i = +sq.dataset.i, m = d[i];
      const pilih = sq.querySelector('input:checked');
      const ok = pilih && +pilih.value === m.a;
      sq.querySelectorAll('.pil').forEach((p,j)=>{
        p.classList.remove('betul','salah','jawapan');
        const dipilihIni = pilih && +pilih.value === j;
        if (j === m.a) p.classList.add(dipilihIni ? 'betul' : 'jawapan');
        else if (dipilihIni) p.classList.add('salah');
      });
      const mk = sq.querySelector('.maklum');
      mk.hidden = false; mk.className = 'maklum ' + (ok?'ok':'no');
      mk.textContent = ok ? '✓ بتول' : '✗ ساله — جواڤن: ' + m.o[m.a];
      if (ok) betul++;
    });
    return siapSkor(bhg, betul);
  }

  bhg.querySelectorAll('.soalan').forEach(sq => {
    const i = +sq.dataset.i;
    const maklum = sq.querySelector('.maklum');
    let ok = false, betulTeks = '';

    if (jenis === 'mcq'){
      const m = t.mcq[i];
      const pilih = sq.querySelector('input:checked');
      ok = pilih && +pilih.value === m.a;
      betulTeks = m.o[m.a];
      sq.querySelectorAll('.pil').forEach((p, j) => {
        p.classList.remove('betul','salah','jawapan');
        const dipilihIni = pilih && +pilih.value === j;
        if (j === m.a) p.classList.add(dipilihIni ? 'betul' : 'jawapan');
        else if (dipilihIni) p.classList.add('salah');
      });
    }
    else if (jenis === 'tf'){
      const m = t.tf[i];
      const pilih = sq.querySelector('input:checked');
      ok = pilih && (pilih.value === '1') === m.a;
      betulTeks = m.a ? 'بتول' : 'ساله';
      sq.querySelectorAll('.pil').forEach((p, j) => {
        p.classList.remove('betul','salah');
        const nilaiP = j === 0;                      // pilihan pertama = بتول
        if (nilaiP === m.a) p.classList.add('betul');
        else if (pilih && (pilih.value === '1') === nilaiP) p.classList.add('salah');
      });
    }
    else {
      const m = t.dd.q[i];
      const lub = sq.querySelector('.lubang');
      ok = lub.dataset.kata === m.a;
      betulTeks = m.a;
      lub.classList.remove('betul','salah');
      lub.classList.add(ok ? 'betul' : 'salah');
    }

    if (ok) betul++;
    maklum.hidden = false;
    maklum.className = 'maklum ' + (ok ? 'ok' : 'no');
    maklum.textContent = ok ? '✓ بتول' : '✗ ساله — جواڤن: ' + betulTeks;
  });

  skorSet[bhg.dataset.set] = betul;
  kemasKini();
  const skor = bhg.querySelector('.skor');
  skor.hidden = false;
  skor.textContent = 'سكور: ' + AR(betul) + ' / ١٠';
  skor.classList.toggle('penuh', betul === 10);
  skor.scrollIntoView({block:'nearest', behavior:'smooth'});
}

function siapSkor(bhg, betul){
  skorSet[bhg.dataset.set] = betul;
  kemasKini();
  const skor = bhg.querySelector('.skor');
  skor.hidden = false;
  skor.textContent = 'سكور: ' + AR(betul) + ' / ١٠';
  skor.classList.toggle('penuh', betul === 10);
  skor.scrollIntoView({block:'nearest', behavior:'smooth'});
}

function ulang(bhg){
  delete skorSet[bhg.dataset.set];
  bhg.querySelectorAll('.kata').forEach(k=>k.classList.remove('tanda-salah','betul','salah','jawapan'));
  bhg.querySelectorAll('select').forEach(s => { s.value=''; s.classList.remove('betul','salah'); s.removeAttribute('title'); });
  bhg.querySelectorAll('textarea').forEach(x => x.value='');
  bhg.querySelectorAll('.model,.tanda').forEach(x => x.hidden = true);
  bhg.querySelectorAll('.tbtn').forEach(x => x.classList.remove('pilih-ok','pilih-no'));
  bhg.querySelectorAll('input:checked').forEach(i => i.checked = false);
  bhg.querySelectorAll('.pil').forEach(p => p.classList.remove('betul','salah','jawapan'));
  bhg.querySelectorAll('.lubang').forEach(l => {
    delete l.dataset.kata; delete l.dataset.chipId;
    l.textContent = ''; l.classList.remove('betul','salah');
  });
  bhg.querySelectorAll('.chip').forEach(c => { c.disabled = false; c.classList.remove('dipilih'); });
  bhg.querySelectorAll('.maklum').forEach(m => { m.hidden = true; m.textContent = ''; });
  const s = bhg.querySelector('.skor'); s.hidden = true; s.classList.remove('penuh');
  dipilih = null;
  kemasKini();
  bhg.scrollIntoView({block:'start', behavior:'smooth'});
}
</script>
